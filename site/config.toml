base_url = "https://hupe1980.github.io/nuvec"
title = "nuvec — MLX for Rust: lazy arrays, autodiff and Metal kernels on Apple Silicon"
description = "nuvec is a pure-Rust array and machine-learning framework for Apple Silicon in the spirit of MLX: lazy arrays on unified memory, grad, vmap and compile, MLX's Metal kernels, and an LLM runtime as fast as mlx-lm."
default_language = "en"
compile_sass = true
minify_html = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
generate_feeds = false
author = "nuvec contributors"

[markdown]
insert_anchor_links = "right"
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
bottom_footnotes = true

[markdown.highlighting]
theme = "github-dark"

[search]
include_title = true
include_description = true
include_content = true
index_format = "elasticlunr_json"

[extra]
repo = "https://github.com/hupe1980/nuvec"
docs_rs = "https://docs.rs/nuvec"
tagline = "MLX for Rust, written in Rust."
