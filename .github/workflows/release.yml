name: release

# Publishes a release when a version tag is pushed (`v0.1.0`, or `v0.2.0-rc.1` for a
# pre-release):
#   1. the tag, the workspace version and CHANGELOG.md must agree;
#   2. the tagged commit must have passed CI;
#   3. the pinned API surface and semver checks pass;
#   4. every crate is published to crates.io, in dependency order;
#   5. a GitHub release is created with the changelog's notes.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with publish rights).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag, version and CI
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag, workspace version and changelog agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [[ "${tag%%-rc.*}" != "${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match the workspace version ${version}" >&2; exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2; exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${tag}" == *-rc.* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      # Only commits CI passed on are released: waits while the CI run of the tagged commit
      # (its push to main) is still in progress.
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" \
              --json status,conclusion --jq '[.[] | "\(.status):\(.conclusion)"] | join(" ")')"
            if [[ " ${runs} " == *" completed:success "* ]]; then
              echo "CI is green on ${GITHUB_SHA}"; exit 0
            fi
            unfinished="$(tr ' ' '\n' <<< "${runs}" | grep -v '^completed:' || true)"
            if [[ -n "${runs}" && -z "${unfinished}" ]]; then
              echo "CI did not pass on ${GITHUB_SHA}: ${runs}" >&2; exit 1
            fi
            echo "waiting for CI on ${GITHUB_SHA} (${runs:-no run yet})"
            sleep 60
          done
          echo "no successful CI run on ${GITHUB_SHA} after 90 minutes; push the commit to main first" >&2
          exit 1

  # The pinned public surface (tests/api_surface.rs) and a semver check of the facade and
  # nuvec-lm against their last published versions.
  api:
    name: API surface and semver
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0" # = rust-toolchain.toml
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-semver-checks,just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just api-check

  publish:
    name: Publish to crates.io
    needs: [check, api]
    # Packages are verified by building them; the Metal toolchain is optional (the shader
    # sources are embedded when it is missing).
    runs-on: macos-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0" # = rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Publish the workspace in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  github-release:
    name: GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release notes from the changelog
        run: |
          version="${{ needs.check.outputs.version }}"
          awk -v v="${version%%-rc.*}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9]/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ needs.check.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "nuvec ${{ needs.check.outputs.version }}" --notes-file notes.md "${flags[@]}"
