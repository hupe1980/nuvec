[package]
name = "nuvec-lm"
description = "LLM runtime for nuvec: Llama, Mistral, Qwen, gpt-oss and Gemma 4 models from MLX and Hugging Face checkpoints, sampling, speculative decoding, batched serving and LoRA"
exclude.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["mlx", "metal", "apple-silicon", "llm", "inference"]
categories.workspace = true

[dependencies]
nuvec.workspace = true
nuvec-nn.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true

[features]
# Routing diagnostics (`model::record_routes`, the `route_overlap` example); off by default
# (it adds a check to every mixture-of-experts forward pass).
diagnostics = []

[[example]]
name = "route_overlap"
required-features = ["diagnostics"]

[dev-dependencies]
# The soak example samples the process footprint (`proc_pid_rusage`).
libc.workspace = true

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[lints]
workspace = true
