[package]
name = "nuvec-core"
description = "Lazy arrays, operations, transforms and evaluation for nuvec"
exclude.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nuvec-cpu.workspace = true
nuvec-gpu.workspace = true
bytemuck.workspace = true
half.workspace = true
smallvec.workspace = true

[dev-dependencies]
# `#[derive(Tree)]` in the tree module's doc examples (`#[tree(crate = "nuvec_core")]`).
nuvec-macros.workspace = true

# Document the Metal API, which only exists on Apple targets.
[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[lints]
workspace = true

[[bench]]
name = "vs_mlx"
harness = false

[[bench]]
name = "gemm"
harness = false

[[bench]]
name = "quant"
harness = false

[[bench]]
name = "fast"
harness = false

[[bench]]
name = "attention_route"
harness = false

[[bench]]
name = "rows"
harness = false
