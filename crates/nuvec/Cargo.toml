[package]
name = "nuvec"
description = "Pure-Rust array framework for Apple Silicon in the spirit of MLX: lazy arrays, unified memory, composable transforms"
exclude.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nuvec-core.workspace = true
nuvec-compile.workspace = true
nuvec-cpu.workspace = true
nuvec-gpu.workspace = true
nuvec-io.workspace = true
nuvec-macros.workspace = true

[dev-dependencies]
trybuild.workspace = true
# `tests/api_surface.rs` pins the surfaces of nuvec-nn and nuvec-lm reached through the
# facade. Path-only (no version), so the published package has no dependency cycle.
nuvec-lm = { path = "../nuvec-lm" }
nuvec-nn = { path = "../nuvec-nn" }

# Document the Metal API, which only exists on Apple targets.
[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[lints]
workspace = true
