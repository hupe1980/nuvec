[package]
name = "nuvec-kernels"
description = "Metal kernel sources and the precompiled nuvec.metallib"
exclude.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The CUDA kernels: generated PTX everywhere, Tile kernels (cutile) on Linux.
cuda = ["dep:cutile"]

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned exactly: the API changes between minors (research/10).
cutile = { version = "=0.4.0", optional = true }

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[lints]
workspace = true
