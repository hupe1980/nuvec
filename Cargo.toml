[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/nuvec"
homepage = "https://github.com/hupe1980/nuvec"
readme = "README.md"
authors = ["hupe1980"]
keywords = ["mlx", "array", "metal", "apple-silicon", "machine-learning"]
categories = ["science", "mathematics"]

[workspace.dependencies]
nuvec = { path = "crates/nuvec", version = "0.0.1" }
nuvec-core = { path = "crates/nuvec-core", version = "0.0.1" }
nuvec-compile = { path = "crates/nuvec-compile", version = "0.0.1" }
nuvec-cpu = { path = "crates/nuvec-cpu", version = "0.0.1" }
nuvec-distributed = { path = "crates/nuvec-distributed", version = "0.0.1" }
nuvec-gpu = { path = "crates/nuvec-gpu", version = "0.0.1" }
nuvec-io = { path = "crates/nuvec-io", version = "0.0.1" }
nuvec-kernels = { path = "crates/nuvec-kernels", version = "0.0.1" }
nuvec-lm = { path = "crates/nuvec-lm", version = "0.0.1" }
nuvec-nn = { path = "crates/nuvec-nn", version = "0.0.1" }

bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2", "block2"] }
gemm = { version = "0.19", default-features = false, features = ["std", "f16", "rayon"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSProcessInfo"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDataType",
    "MTLDevice",
    "MTLFence",
    "MTLFunctionConstantValues",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }
half = { version = "2.7", features = ["bytemuck"] }
smallvec = { version = "1", features = ["union", "const_generics"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

# Constitution I: every `unsafe` block carries a `// SAFETY:` justification.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
