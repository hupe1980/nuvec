[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/rusty-metal"
authors = ["hupe1980"]
publish = false

[workspace.dependencies]
nuvect = { path = "crates/nuvect" }
nuvect-core = { path = "crates/nuvect-core" }
nuvect-compile = { path = "crates/nuvect-compile" }
nuvect-cpu = { path = "crates/nuvect-cpu" }
nuvect-distributed = { path = "crates/nuvect-distributed" }
nuvect-gpu = { path = "crates/nuvect-gpu" }
nuvect-io = { path = "crates/nuvect-io" }
nuvect-kernels = { path = "crates/nuvect-kernels" }
nuvect-lm = { path = "crates/nuvect-lm" }
nuvect-nn = { path = "crates/nuvect-nn" }

bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
gemm = { version = "0.19", default-features = false, features = ["std", "f16", "rayon"] }
half = { version = "2.7", features = ["bytemuck"] }
smallvec = { version = "1", features = ["union", "const_generics"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

# Constitution I: every `unsafe` block carries a `// SAFETY:` justification.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
